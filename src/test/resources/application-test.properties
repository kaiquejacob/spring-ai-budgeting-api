spring.datasource.url=jdbc:mysql://localhost:3307/transaction
spring.datasource.username=app
spring.datasource.password=app
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

spring.ai.retry.max-attempts=1
spring.ai.openai.api-key=${GROQ_API_KEY}
spring.ai.openai.base-url=https://api.groq.com/openai

app.ai.chat.model=openai/gpt-oss-20b
app.ai.chat.temperature=0.2
app.ai.transcription.model=whisper-large-v3-turbo

spring.ai.openai.audio.transcription.options.model=whisper-large-v3-turbo