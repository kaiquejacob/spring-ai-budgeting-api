spring.datasource.url=jdbc:h2:mem:budgeting;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

spring.jpa.hibernate.ddl-auto=create-drop
spring.flyway.enabled=false
spring.autoconfigure.exclude=org.springframework.ai.model.chat.memory.repository.jdbc.autoconfigure.JdbcChatMemoryRepositoryAutoConfiguration
spring.jpa.show-sql=false
spring.docker.compose.enabled=false

spring.ai.retry.max-attempts=1
spring.ai.openai.api-key=${GROQ_API_KEY:test-key}
spring.ai.openai.base-url=https://api.groq.com/openai

app.gemini.api-key=${GEMINI_API_KEY:test-key}
app.ai.chat.model=openai/gpt-oss-20b
app.ai.chat.temperature=0.2
app.ai.transcription.model=whisper-large-v3-turbo

spring.ai.openai.audio.transcription.options.model=whisper-large-v3-turbo
