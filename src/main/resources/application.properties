spring.application.name=budgeting
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.http.clients.connect-timeout=3s
spring.http.clients.read-timeout=60s
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# MySQL
spring.datasource.url=jdbc:mysql://localhost:3307/transaction
spring.datasource.username=app
spring.datasource.password=app
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# Spring AI / Groq
spring.ai.retry.max-attempts=1
spring.ai.openai.api-key=${GROQ_API_KEY:dummy-key-for-tests}
spring.ai.openai.base-url=${GROQ_BASE_URL:https://api.groq.com/openai}
spring.ai.openai.chat.options.timeout=30s

# Configurações próprias da aplicação
app.ai.chat.model=${GROQ_CHAT_MODEL:openai/gpt-oss-20b}
app.ai.chat.temperature=${GROQ_CHAT_TEMPERATURE:0.2}
app.ai.transcription.model=${GROQ_TRANSCRIPTION_MODEL:whisper-large-v3-turbo}
spring.ai.openai.audio.transcription.options.model=${GROQ_TRANSCRIPTION_MODEL:whisper-large-v3-turbo}

spring.ai.openai.chat.options.model=${GROQ_CHAT_MODEL:openai/gpt-oss-20b}
spring.ai.openai.chat.options.temperature=${GROQ_CHAT_TEMPERATURE:0.2}

# Gemini
app.gemini.api-key=${GEMINI_API_KEY:}
app.gemini.base-url=${GEMINI_BASE_URL:https://generativelanguage.googleapis.com/v1beta}
app.gemini.model=${GEMINI_CHAT_MODEL:gemini-3.5-flash}

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized
management.endpoint.health.show-components=always
management.info.env.enabled=true

info.app.name=spring-ai-budgeting-api
info.app.description=Assistente financeiro com Spring Boot, Spring AI, Groq e Gemini
info.app.version=1.0.0

# Logging
logging.level.org.springframework.ai=DEBUG