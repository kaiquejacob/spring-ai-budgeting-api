spring.application.name=budgeting
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Configuração do MySQL conforme compose.yml
spring.datasource.url=jdbc:mysql://localhost:3307/transaction
spring.datasource.username=app
spring.datasource.password=app
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# Desativa as tentativas seguidas para resposta imediata no Postman
spring.ai.retry.max-attempts=1

# Configuração do Groq
spring.ai.openai.base-url=https://api.groq.com/openai
spring.ai.openai.api-key=${GROQ_API_KEY:dummy-key-for-tests}

# Modelo de Chat oficial ativo no Groq
spring.ai.openai.chat.options.model=openai/gpt-oss-20b

# Transcrição de Áudio via Groq (Whisper)
spring.ai.model.audio.transcription=openai
spring.ai.openai.audio.transcription.options.model=whisper-large-v3-turbo

logging.level.org.springframework.ai=DEBUG